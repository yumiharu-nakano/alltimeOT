[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alltime_ot"
version = "0.1.0"
description = "All-time optimal transport: RKHS drift estimator from marginal snapshots"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "torch>=2.1",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["alltime_ot*"]
exclude = ["experiments*", "output*"]
